name: Site browser journeys
on:
  pull_request:
    paths: ['**/*.html', 'assets/**', 'scripts/test_public_journeys_browser.py', '.github/workflows/site-browser-qa.yml']
  push:
    branches: [master]
    paths: ['**/*.html', 'assets/**', 'scripts/test_public_journeys_browser.py', '.github/workflows/site-browser-qa.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npm install --no-save --ignore-scripts axe-core@4.10.3
      - run: python scripts/test_public_journeys_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-qa
          path: browser-qa/
