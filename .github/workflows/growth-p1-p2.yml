name: Organic growth P1 P2 gate
on:
  push:
    branches: [master]
    paths:
      - '**/*.html'
      - 'llms.txt'
      - 'en/llms.txt'
      - 'es/llms.txt'
      - 'functions/**'
      - 'scripts/apply_growth_p1_p2.py'
      - 'scripts/build_pages_2026.py'
      - 'scripts/stamp_page_dates.py'
      - 'content/pages/**'
      - 'assets/css/ec-pages-2026.css'
      - 'scripts/refresh_menu_highlights.py'
      - 'scripts/test_growth_router.mjs'
      - 'data/seo-intents.json'
      - 'assets/css/ec-growth-links.css'
      - '.github/workflows/growth-p1-p2.yml'
  pull_request:
    branches: [master]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/apply_growth_p1_p2.py --check
      - run: python3 scripts/build_pages_2026.py --check
      - run: python3 scripts/stamp_page_dates.py --check
      - run: node scripts/test_growth_router.mjs
      - run: python3 scripts/schema_jsonld_duplicate_key_guard.py --check
      - run: python3 scripts/schema_rating_guard.py --check
      - run: python3 scripts/audit_hreflang_pt_en_es.py
      - run: python3 scripts/audit_p2_visit_hub.py
      - run: python3 scripts/build_cloudflare_pages.py
