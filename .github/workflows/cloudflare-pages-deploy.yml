# Publica o site no projeto Cloudflare Pages "embaixada-carioca" a cada push no master.
#
# Por quê: em 2026-10-05 o repositório saiu de LeoRangel22 para a organização
# Embaixada-Carioca. O projeto do Cloudflare continua ligado ao dono antigo e a
# integração Git deixou de publicar ("internal issue with your Cloudflare Workers
# & Pages Git installation"). A documentação do Cloudflare indica devolver o repo
# ou criar outro projeto; este workflow mantém o projeto e o domínio atuais e
# publica por upload direto.
#
# Requer o secret CLOUDFLARE_API_TOKEN (token com permissão Cloudflare Pages: Edit).
name: Cloudflare Pages deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 834b3bc751aec01030073d384b0c579e
    steps:
      - name: Check token
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$RAW_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN ausente. Crie um token com permissão Cloudflare Pages: Edit e cadastre em Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Tokens do Cloudflare não têm espaços nem quebras de linha: usa a primeira
          # linha não vazia, sem espaços nas pontas (cobre colagens com sobras).
          lines=$(printf '%s\n' "$RAW_TOKEN" | grep -c '[^[:space:]]' || true)
          TOKEN=$(printf '%s\n' "$RAW_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -m1 .)
          echo "::add-mask::$TOKEN"
          if [ "$lines" -gt 1 ]; then
            echo "::warning::O secret CLOUDFLARE_API_TOKEN tem $lines linhas; usando só a primeira. Recadastre só o token para evitar dúvida."
          fi
          status=$(curl -s -o /tmp/verify.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$status" != "200" ] || ! grep -q '"status":"active"' /tmp/verify.json; then
            echo "::error::O Cloudflare não aceitou o token (HTTP $status). Recrie o token (Cloudflare Pages: Edit) e recadastre o secret só com ele."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "Token aceito pelo Cloudflare."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: python3 scripts/build_cloudflare_pages.py

      - name: Router regression test
        run: node scripts/test_growth_router.mjs

      - name: Deploy to Cloudflare Pages (production)
        # Roda na raiz do repositório para o wrangler compilar ./functions junto com _site.
        run: |
          npx --yes wrangler@3.114.0 pages deploy _site \
            --project-name=embaixada-carioca \
            --branch=master \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$(git log -1 --format=%s "$GITHUB_SHA" | cut -c1-200)"
