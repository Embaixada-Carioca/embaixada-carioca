name: Verify live site
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Cloudflare Pages deploy]
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: read
jobs:
  verify-live-site:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deployment, languages, journeys and asset hashes independently
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: python3 scripts/verify_live_site.py --expected-sha "$EXPECTED_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-health
          path: site-health.json
