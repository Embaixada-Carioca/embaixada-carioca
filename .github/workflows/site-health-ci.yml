name: Site health contract
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/test_site_health.py
      - run: python3 scripts/build_cloudflare_pages.py
      - run: node scripts/test_growth_router.mjs
